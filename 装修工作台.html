<!DOCTYPE html>
<!-- 本工作台通过 WorkBuddy 资料库能力（library skill）搭建、存储和部署 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>悠然 · 装修工作台</title>
<style>
  :root{
    --bg:#efe7d9; --bg2:#e7dccb; --card:#faf6ee; --card2:#f4ecdd;
    --ink:#4a4036; --ink2:#7a6e5d; --line:#ddd2c0; --line2:#cabfa9;
    --clay:#a9794f; --clay-d:#8a6138; --sage:#7c8a6b; --sage-d:#5f6c50;
    --red:#b5543f; --red-bg:#f3ddd6; --green:#6b8e5a; --green-bg:#dfe9d6;
    --amber:#c08a3e; --shadow:0 2px 10px rgba(74,64,54,.10);
    --r:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink); font-size:15px; line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink);
    background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--clay)}
  textarea{resize:vertical;min-height:70px}
  .btn{min-height:44px;border:none;border-radius:12px;padding:10px 16px;font-size:15px;
    display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;transition:.15s}
  .btn-primary{background:var(--clay);color:#fff}
  .btn-primary:active{background:var(--clay-d)}
  .btn-ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
  .btn-ghost:active{background:var(--card2)}
  .btn-sm{min-height:36px;padding:7px 12px;font-size:13px;border-radius:10px}
  .btn-danger{background:var(--red-bg);color:var(--red);border:1px solid #e6c3b8}
  .icon{width:20px;height:20px;display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .icon-sm{width:16px;height:16px}

  /* topbar */
  .topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;
    padding:12px 18px;background:rgba(239,231,217,.92);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:.5px}
  .brand .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--clay),var(--sage));display:flex;align-items:center;justify-content:center}
  .brand .logo svg{width:18px;height:18px;stroke:#fff}
  .spacer{flex:1}
  .sync{display:flex;align-items:center;gap:6px;font-size:12.5px;padding:6px 10px;border-radius:20px;
    border:1px solid var(--line);background:var(--card);color:var(--ink2);white-space:nowrap}
  .sync .dot{width:8px;height:8px;border-radius:50%}
  .sync.online .dot{background:var(--green)} .sync.offline .dot{background:var(--amber)}
  .topbar .tools{display:flex;gap:8px;flex-wrap:wrap}

  /* layout */
  .layout{display:flex;min-height:calc(100vh - 62px)}
  .sidebar{width:216px;flex:none;padding:18px 12px;border-right:1px solid var(--line);
    background:var(--bg2);position:sticky;top:62px;height:calc(100vh - 62px);overflow:auto}
  .nav-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;
    color:var(--ink2);font-weight:600;margin-bottom:6px;font-size:15px;width:100%;text-align:left;background:none;border:none}
  .nav-item .icon{width:21px;height:21px}
  .nav-item.active{background:var(--card);color:var(--clay-d);box-shadow:var(--shadow)}
  .nav-item:active{background:var(--card2)}
  .content{flex:1;padding:20px;max-width:1100px;margin:0 auto;width:100%}
  .page{display:none;animation:fade .25s ease}
  .page.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  h2.page-title{margin:0 0 4px;font-size:21px}
  .sub{color:var(--ink2);font-size:13.5px;margin-bottom:18px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
  .grid{display:grid;gap:14px}
  .cards4{grid-template-columns:repeat(4,1fr)}
  .cards2{grid-template-columns:repeat(2,1fr)}
  @media(max-width:820px){.cards4{grid-template-columns:repeat(2,1fr)}.cards2{grid-template-columns:1fr}}

  .stat .label{font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:6px}
  .stat .val{font-size:26px;font-weight:700;margin-top:6px;letter-spacing:.5px}
  .stat .val small{font-size:14px;font-weight:600;color:var(--ink2)}
  .stat.alert{border-color:#e6c3b8;background:var(--red-bg)}
  .stat.alert .val{color:var(--red)}

  .section-title{display:flex;align-items:center;justify-content:space-between;margin:22px 0 12px}
  .section-title h3{margin:0;font-size:17px}
  .pill{font-size:12px;padding:3px 10px;border-radius:20px;background:var(--card2);color:var(--ink2);border:1px solid var(--line)}

  /* today */
  .today{background:linear-gradient(135deg,#f7efe1,#f1e6d2);border:1px solid var(--line2);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
  .today h3{margin:0 0 12px;font-size:16px;display:flex;align-items:center;gap:8px}
  .td-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px dashed var(--line)}
  .td-item:first-of-type{border-top:none}
  .td-main{flex:1;min-width:0}
  .td-name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .td-meta{font-size:12.5px;color:var(--ink2)}
  .tag{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:8px;margin-right:6px;background:var(--card2);color:var(--ink2);border:1px solid var(--line)}
  .tag.over{background:var(--red-bg);color:var(--red);border-color:#e6c3b8;font-weight:700}
  .tag.p0{background:#f0d9cf;color:#9c4430}.tag.p1{background:#efe2c9;color:#8a6a2e}.tag.p2{background:#dde3d2;color:#5f6c50}
  .tag.phase{background:#e6ddd9;color:var(--clay-d)}

  /* profile */
  .profile-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  @media(max-width:680px){.profile-grid{grid-template-columns:repeat(2,1fr)}}
  .pf{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .pf .k{font-size:12px;color:var(--ink2)}
  .pf .v{font-size:17px;font-weight:700;margin-top:3px}
  .countdown{background:var(--sage);color:#fff;border-radius:12px;padding:14px;display:flex;flex-direction:column;justify-content:center}
  .countdown .v{font-size:24px;font-weight:700}
  .countdown .k{font-size:12px;opacity:.9}

  /* phases */
  .phase{border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden;background:var(--card)}
  .phase-head{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer}
  .phase-head .num{width:26px;height:26px;border-radius:50%;background:var(--clay);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none}
  .phase-head .nm{flex:1;font-weight:700;font-size:16px}
  .phase-head .pg{font-size:13px;color:var(--ink2);min-width:86px;text-align:right}
  .bar{height:7px;background:var(--card2);border-radius:6px;overflow:hidden;flex:1;max-width:160px}
  .bar > i{display:block;height:100%;background:var(--sage);border-radius:6px}
  .phase-body{display:none;padding:0 16px 14px;border-top:1px solid var(--line)}
  .phase.open .phase-body{display:block}
  .sub-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px dashed var(--line)}
  .sub-item:first-child{border-top:none}
  .sub-main{flex:1;min-width:0}
  .sub-name{font-weight:600}
  .sub-name.done{text-decoration:line-through;color:var(--ink2)}
  .sub-dates{font-size:12px;color:var(--ink2);margin-top:2px}
  .sub-owner{display:inline-flex;align-items:center;gap:5px;margin-top:5px;font-size:12.5px;color:var(--clay-d);background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:2px 10px;width:fit-content}
  .sub-owner svg{width:13px;height:13px;flex:none}

  /* phase budget */
  .phase-budget{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:flex-start;padding:10px 0;margin-top:6px;border-top:1px dashed var(--line);font-size:13px;color:var(--red)}
  .phase-budget > span{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
  .pb-label{font-weight:700}
  .pb-amount{font-weight:700;font-variant-numeric:tabular-nums}
  .pb-item{display:inline-flex;align-items:center;gap:4px;background:var(--red-bg);border:1px solid #e6c3b8;border-radius:8px;padding:3px 8px;font-size:12.5px;color:var(--red)}
  .pb-item .note{color:#9c4430;font-weight:500}
  .pb-empty{color:var(--ink2);font-size:12.5px}
  @media(max-width:680px){
    .phase-budget{gap:8px 12px;font-size:12.5px}
    .pb-item{padding:2px 6px;font-size:12px}
  }

  /* budget dimension progress bars */
  .bdim{padding:6px 0}
  .bdim-row{display:grid;grid-template-columns:70px 1fr 150px;gap:14px;align-items:center;margin-bottom:16px}
  .bdim-row:last-child{margin-bottom:0}
  .bdim-col-name{font-size:13.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bdim-col-bar{min-width:0}
  .bdim-col-num{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
  .bdim-col-num .over{color:#e03030;font-weight:700;margin-left:6px}
  .bdim-ruler{position:relative;height:12px;margin-bottom:4px}
  .bdim-ruler span{position:absolute;top:0;transform:translateX(-50%);font-size:10.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
  .bdim-ruler span:first-child{left:0;transform:none}
  .bdim-ruler span:nth-child(2){left:25%}
  .bdim-ruler span:nth-child(3){left:50%}
  .bdim-ruler span:nth-child(4){left:75%}
  .bdim-ruler span:last-child{left:100%;transform:translateX(-100%)}
  .bdim-track{height:18px;background:var(--card2);border-radius:999px;overflow:hidden;display:flex;position:relative}
  .bdim-green{height:100%;background:#2a9d4f;transition:width .25s ease}
  .bdim-red{height:100%;background:#e03030;border-radius:0 999px 999px 0;transition:width .25s ease}
  @media(max-width:680px){
    .bdim-row{grid-template-columns:1fr;gap:4px;align-items:stretch;margin-bottom:18px}
    .bdim-col-num{text-align:left}
    .bdim-ruler{height:14px;margin-bottom:5px}
  }

  /* gantt */
  .gantt-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card);padding:14px}
  .gantt{display:block}

  /* table */
  .tbl{width:100%;border-collapse:collapse;font-size:14px}
  .tbl th,.tbl td{padding:11px 10px;text-align:left;border-bottom:1px solid var(--line)}
  .tbl th{font-size:12.5px;color:var(--ink2);font-weight:600;background:var(--card2)}
  .tbl tr:hover td{background:var(--card2)}
  .tbl .num{text-align:right;font-variant-numeric:tabular-nums}
  .over-row{background:var(--red-bg)!important}
  .over-row td:first-child{box-shadow:inset 3px 0 0 var(--red)}
  .mini-btn{min-height:34px;padding:6px 10px;border-radius:9px;border:1px solid var(--line);background:var(--card);font-size:13px;color:var(--ink2)}
  .mini-btn:active{background:var(--card2)}
  .row-actions{display:flex;gap:6px;flex-wrap:wrap}
  .toggle{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2)}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .seg button{border:none;background:var(--card);padding:8px 14px;font-size:13px;color:var(--ink2);min-height:38px}
  .seg button.on{background:var(--clay);color:#fff;font-weight:600}

  /* todos */
  .filterbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
  .todo{border:1px solid var(--line);border-radius:13px;padding:13px 14px;margin-bottom:10px;background:var(--card);display:flex;align-items:flex-start;gap:12px}
  .todo .ck{width:22px;height:22px;border-radius:7px;border:2px solid var(--line2);flex:none;margin-top:2px;display:flex;align-items:center;justify-content:center;background:var(--card)}
  .todo.done .ck{background:var(--sage);border-color:var(--sage)}
  .todo .ck svg{width:14px;height:14px;stroke:#fff;opacity:0}
  .todo.done .ck svg{opacity:1}
  .todo-main{flex:1;min-width:0}
  .todo-name{font-weight:600}
  .todo.done .todo-name{text-decoration:line-through;color:var(--ink2)}
  .todo-meta{font-size:12.5px;color:var(--ink2);margin-top:4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}

  /* inspiration */
  .insp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
  .insp{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card);box-shadow:var(--shadow)}
  .insp .ph{width:100%;aspect-ratio:4/3;background:var(--card2);display:flex;align-items:center;justify-content:center;color:var(--ink2);font-size:13px;position:relative}
  .insp .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .insp .star{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;background:rgba(250,246,238,.9);display:flex;align-items:center;justify-content:center;border:none}
  .insp .star svg{width:17px;height:17px;fill:none;stroke:var(--clay);stroke-width:1.8}
  .insp .star.on svg{fill:var(--clay);stroke:var(--clay)}
  .insp .body{padding:11px 12px}
  .insp .ttl{font-weight:700;font-size:14.5px;margin-bottom:6px}
  .insp .tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px}
  .insp .note{font-size:12.5px;color:var(--ink2)}
  .upload-zone{border:2px dashed var(--line2);border-radius:14px;padding:18px;text-align:center;color:var(--ink2);background:var(--card2);cursor:pointer}
  .upload-zone:active{background:var(--card)}

  /* modal */
  .mask{position:fixed;inset:0;background:rgba(54,46,38,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}
  .mask.show{display:flex}
  .modal{background:var(--bg);width:100%;max-width:520px;max-height:90vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px;box-shadow:0 -6px 30px rgba(0,0,0,.2)}
  @media(min-width:560px){.mask{align-items:center}.modal{border-radius:20px}}
  .modal h3{margin:0 0 16px;font-size:19px;display:flex;align-items:center;justify-content:space-between}
  .modal .x{border:none;background:none;font-size:22px;color:var(--ink2);min-height:44px;min-width:44px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:13px;color:var(--ink2);margin-bottom:6px;font-weight:600}
  .checks{display:flex;gap:8px;flex-wrap:wrap}
  .chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:7px 11px;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer}
  .chk.on{background:var(--clay);color:#fff;border-color:var(--clay)}
  .modal-actions{display:flex;gap:10px;margin-top:8px}
  .modal-actions .btn{flex:1}
  .imgprev{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .imgprev img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}

  .empty{text-align:center;color:var(--ink2);padding:30px 10px;font-size:14px}
  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;
    padding:11px 18px;border-radius:24px;font-size:14px;opacity:0;transition:.25s;z-index:80;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* bottom nav (mobile) */
  .bottomnav{display:none}
  @media(max-width:768px){
    .sidebar{display:none}
    .content{padding:14px;padding-bottom:90px}
    .bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:40;
      background:rgba(250,246,238,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);
      padding:6px 4px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
    .bn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:none;background:none;
      color:var(--ink2);font-size:11px;padding:6px 0;min-height:44px;justify-content:center}
    .bn.active{color:var(--clay-d)}
    .bn .icon{width:22px;height:22px}
    .topbar .tools .btn .lbl{display:none}
  }
  @media(min-width:769px){.bottomnav{display:none}.topbar .tools .btn .lbl{display:inline}}
  .dim-note{font-size:12.5px;color:var(--ink2);margin:6px 0 12px}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7M5 10v9h14v-9"/></svg></span>
    <span>悠然 · 装修工作台</span>
  </div>
  <div class="spacer"></div>
  <div id="syncBadge" class="sync offline"><span class="dot"></span><span id="syncText">检测中…</span></div>
  <div class="tools">
    <button class="btn btn-ghost btn-sm" onclick="exportJSON()"><svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg><span class="lbl">导出JSON</span></button>
    <button class="btn btn-ghost btn-sm" onclick="backupArea()"><svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M4 7h16v13H4zM4 7l2-3h12l2 3M9 12h6"/></svg><span class="lbl">数据管理</span></button>
  </div>
</header>

<div class="layout">
  <nav class="sidebar" id="sidebar">
    <button class="nav-item active" data-page="overview"><svg class="icon" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7M5 10v9h14v-9"/></svg>首页概览</button>
    <button class="nav-item" data-page="progress"><svg class="icon" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>施工进度</button>
    <button class="nav-item" data-page="todos"><svg class="icon" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>待办清单</button>
    <button class="nav-item" data-page="budget"><svg class="icon" viewBox="0 0 24 24"><path d="M3 7h18v12H3zM3 7l2-3h14l2 3M7 12h4"/></svg>预算管理</button>
    <button class="nav-item" data-page="inspiration"><svg class="icon" viewBox="0 0 24 24"><path d="M4 16l5-6 4 4 3-4 4 6M4 16h16M4 16v2h16v-2"/></svg>灵感库</button>
  </nav>

  <main class="content">
    <!-- 首页概览 -->
    <section id="page-overview" class="page active">
      <h2 class="page-title">首页概览</h2>
      <div class="sub">一眼掌握装修全局</div>

      <div class="today" data-sp-bindable="database" data-sp-database-id="UnbBZTMp6FzsqUzsszm0An">
        <h3><svg class="icon" viewBox="0 0 24 24"><path d="M12 7v5l3 2M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z"/></svg>今天要处理</h3>
        <div id="todayList"></div>
      </div>

      <div class="grid cards4" style="margin-top:18px">
        <div class="card stat" data-sp-bindable="database" data-sp-database-id="UnbBZTMp6FzsqUzsszm0An"><div class="label">工程进度</div><div class="val" id="stProgress">0<small>%</small></div></div>
        <div class="card stat" data-sp-bindable="database" data-sp-database-id="AJuMSspTPnpN3h8xZfAzcN"><div class="label">实际花销</div><div class="val" id="stSpent">¥0</div></div>
        <div class="card stat" data-sp-bindable="database" data-sp-database-id="akIo0pcgrvmxQ19M6jzNMe"><div class="label">剩余预算</div><div class="val" id="stRemain">¥0</div></div>
        <div class="card stat" data-sp-bindable="database" data-sp-database-id="UnbBZTMp6FzsqUzsszm0An"><div class="label">待处理事项</div><div class="val" id="stTodo">0<small> 项</small></div></div>

/* ===== 资料库 databaseId（部署后页面通过 __SMART_PAGE__.database 实现双向读写）===== */

var SCHEMA = {

var FIELDS = { tasks:Object.keys(SCHEMA.tasks), budget:Object.keys(SCHEMA.budget), inspiration:Object.keys(SCHEMA.inspiration), profile:Object.keys(SCHEMA.profile), budgetcfg:Object.keys(SCHEMA.budgetcfg) };
// databaseId -> schema key（DB 存的是真实资料库 ID，SCHEMA/FIELDS/OPTIONS 用简短 key）
var DB_KEY = {}; Object.keys(DB).forEach(function(k){ DB_KEY[DB[k]]=k; });
function dbKey(id){ return DB_KEY[id] || id; }

/* ===== 统一存储层：在线(SDK) / 离线(localStorage) ===== */
/* 在线模式下 db 由平台注入 __SMART_PAGE__.database；databaseId 必须字面量（lint DSDK002） */
var db = (window.__SMART_PAGE__ && window.__SMART_PAGE__.database) ? window.__SMART_PAGE__.database : null;

/* ===== api 模式辅助（经 server.js 读写 CSV）===== */
var RENO_TOKEN = (localStorage.getItem('wb_reno_token')||'');
function apiHeaders(extra){
  var h=extra||{}; h['Content-Type']='application/json';
  if(RENO_TOKEN) h['x-reno-token']=RENO_TOKEN;
  return h;
}
function apiFetch(url, opts){
  opts=opts||{}; opts.headers=apiHeaders(opts.headers);
  return fetch(url, opts).then(function(res){
    if(res.status===401){
      var tk=window.prompt('该装修工作台需要访问口令（联系管理员获取）：');
      if(tk===null) return Promise.reject(new Error('缺少访问口令'));
      RENO_TOKEN=tk; localStorage.setItem('wb_reno_token', tk);
      opts.headers=apiHeaders(opts.headers);
      return fetch(url, opts);
    }
    if(!res.ok) return Promise.reject(new Error('请求失败('+res.status+')'));
    return res;
  });
}
// 把 toProps 产生的 PropertyValue 结构还原为普通 {field:value}，供服务端落盘
function plainProps(dbId, props){
  var key=dbKey(dbId); var t=SCHEMA[key]; var out={};
  FIELDS[key].forEach(function(f){
    if(!(f in props)) return;
    var v=props[f];
    if(v && typeof v==='object' && !Array.isArray(v)){
      if('text' in v) v=v.text;
      else if('number' in v) v=v.number;
      else if('select' in v) v=v.select;
      else if('checkbox' in v) v=v.checkbox;
      else if('date' in v) v=v.date;
      else if('multi_select' in v) v=(v.multi_select||[]);
      else if('image' in v) v=(v.image&&v.image.images)||[];
    }
    out[f]=v;
  });
  return out;
}

var Store = {
  mode: db ? 'online' : (window.__RENO_API__ ? 'api' : 'offline'),
  init:function(){ this.mode = db ? 'online' : (window.__RENO_API__ ? 'api' : 'offline'); },
  _ls:function(dbId){ try{ return JSON.parse(localStorage.getItem('wb_reno_'+dbId)||'[]'); }catch(e){ return []; } },
  _sv:function(dbId,a){ localStorage.setItem('wb_reno_'+dbId, JSON.stringify(a)); },
  query:function(dbId){
    if(this.mode==='api'){ return apiFetch('/api/'+dbKey(dbId)).then(function(r){ return r.json(); }); }
    if(this.mode!=='online') return Promise.resolve(this._ls(dbId));
    var p;
    if(dbId==='akIo0pcgrvmxQ19M6jzNMe') p=db.query({ databaseId:'akIo0pcgrvmxQ19M6jzNMe', pageSize:200 });
    else if(dbId==='UnbBZTMp6FzsqUzsszm0An') p=db.query({ databaseId:'UnbBZTMp6FzsqUzsszm0An', pageSize:200 });
    else if(dbId==='AJuMSspTPnpN3h8xZfAzcN') p=db.query({ databaseId:'AJuMSspTPnpN3h8xZfAzcN', pageSize:200 });
    else if(dbId==='RenoBudgetCfg') p=Promise.resolve({results:[]});
    else p=db.query({ databaseId:'YsYGf5Q8viu0TQNU1P2cpM', pageSize:200 });
    return p.then(function(r){ return (r&&r.results)||[]; });
  },
  add:function(dbId, props){
    if(this.mode==='api'){ return apiFetch('/api/'+dbKey(dbId), {method:'POST', body:JSON.stringify(plainProps(dbId,props))}).then(function(r){ return r.json(); }).then(function(o){ return o&&o.id; }); }
    if(this.mode!=='online'){ var rec={ _id:genId() }; for(var k in props){ rec[k]=props[k]; } var a=this._ls(dbId); a.push(rec); this._sv(dbId,a); return Promise.resolve(rec._id); }
    var p;
    if(dbId==='akIo0pcgrvmxQ19M6jzNMe') p=db.addRecord({ databaseId:'akIo0pcgrvmxQ19M6jzNMe', properties:props });
    else if(dbId==='UnbBZTMp6FzsqUzsszm0An') p=db.addRecord({ databaseId:'UnbBZTMp6FzsqUzsszm0An', properties:props });
    else if(dbId==='AJuMSspTPnpN3h8xZfAzcN') p=db.addRecord({ databaseId:'AJuMSspTPnpN3h8xZfAzcN', properties:props });
    else if(dbId==='RenoBudgetCfg') p=Promise.resolve({id:'cfg'});
    else p=db.addRecord({ databaseId:'YsYGf5Q8viu0TQNU1P2cpM', properties:props });
    return p.then(function(r){ return r&&r.id; });

  update:function(dbId, id, props){
    if(this.mode==='api'){ return apiFetch('/api/'+dbKey(dbId)+'/'+id, {method:'PUT', body:JSON.stringify(plainProps(dbId,props))}).then(function(){ return true; }); }
    if(this.mode!=='online'){ var a=this._ls(dbId), f=false; for(var i=0;i<a.length;i++){ if(a[i]._id===id){ for(var k in props){ a[i][k]=props[k]; } f=true; break; } } if(f) this._sv(dbId,a); return Promise.resolve(true); }
    var p;
    if(dbId==='akIo0pcgrvmxQ19M6jzNMe') p=db.updateRecord({ databaseId:'akIo0pcgrvmxQ19M6jzNMe', recordId:id, properties:props });
    else if(dbId==='UnbBZTMp6FzsqUzsszm0An') p=db.updateRecord({ databaseId:'UnbBZTMp6FzsqUzsszm0An', recordId:id, properties:props });
    else if(dbId==='AJuMSspTPnpN3h8xZfAzcN') p=db.updateRecord({ databaseId:'AJuMSspTPnpN3h8xZfAzcN', recordId:id, properties:props });
    else if(dbId==='RenoBudgetCfg') p=Promise.resolve();
    else p=db.updateRecord({ databaseId:'YsYGf5Q8viu0TQNU1P2cpM', recordId:id, properties:props });
    return p.then(function(){ return true; });
  },
  remove:function(dbId, id){
    if(this.mode==='api'){ return apiFetch('/api/'+dbKey(dbId)+'/'+id, {method:'DELETE'}).then(function(){ return true; }); }
    if(this.mode!=='online'){ var a=this._ls(dbId).filter(function(r){ return r._id!==id; }); this._sv(dbId,a); return Promise.resolve(true); }
    var p;
    if(dbId==='akIo0pcgrvmxQ19M6jzNMe') p=db.deleteRecord({ databaseId:'akIo0pcgrvmxQ19M6jzNMe', recordId:id });

    else if(dbId==='RenoBudgetCfg') p=Promise.resolve();
    else p=db.deleteRecord({ databaseId:'YsYGf5Q8viu0TQNU1P2cpM', recordId:id });
    return p.then(function(){ return true; });
  },
  removeMany:function(dbId, ids){
    var self=this; return Promise.all(ids.map(function(id){ return self.remove(dbId,id); }));
  }
};

function genId(){ return 'rec_'+Math.random().toString(36).slice(2,10)+Date.now().toString(36); }
function pad(n){ return (n<10?'0':'')+n; }
function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function money(n){ n=Number(n)||0; return '¥'+n.toLocaleString('zh-CN'); }
function daysBetween(a,b){ var d1=new Date(a), d2=new Date(b); return Math.round((d2-d1)/86400000); }
function toast(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(function(){ t.classList.remove('show'); },1800); }

/* 规范化 SDK 返回值 → 可直接使用的对象；反向 toProps 转 PropertyValue */
function normRow(dbId, raw){
  var key=dbKey(dbId); var r={ _id: raw._id }; var t=SCHEMA[key];
  FIELDS[key].forEach(function(f){
    var rawv=raw[f]; var ty=t[f];
    // 同时兼容 PropertyValue 对象（离线 localStorage / SDK）和普通值
    var v=rawv;
    if(rawv!==undefined && rawv!==null && typeof rawv==='object'){
      if(ty==='number' && 'number' in rawv) v=rawv.number;
      else if(ty==='checkbox' && 'checkbox' in rawv) v=rawv.checkbox;
      else if(ty==='date' && 'date' in rawv) v=rawv.date;
      else if(ty==='multi_select' && 'multi_select' in rawv) v=rawv.multi_select;
      else if(ty==='image' && 'image' in rawv) v=(rawv.image && rawv.image.images)||[];
      else if('text' in rawv) v=rawv.text;
      else if('select' in rawv) v=rawv.select;
    }
    if(v===undefined||v===null){ r[f]= (ty==='number'?0:(ty==='multi_select'||ty==='image'?[]:(ty==='checkbox'?false:''))); }
    else if(ty==='date'){ r[f]=String(v).slice(0,10); }
    else if(ty==='number'){ r[f]=Number(v)||0; }
    else if(ty==='multi_select'){ r[f]=Array.isArray(v)?v:[]; }
    else if(ty==='checkbox'){ r[f]=!!v; }
    else if(ty==='image'){ r[f]=Array.isArray(v)?v:[]; }
    else { r[f]=v; }
  });
  return r;
}
function toProps(dbId, obj){
  var key=dbKey(dbId); var p={}, t=SCHEMA[key];
  FIELDS[key].forEach(function(f){
    if(!(f in obj)) return; var v=obj[f]; var ty=t[f];
    if(ty==='number') p[f]={number:Number(v)||0};
    else if(ty==='checkbox') p[f]={checkbox:!!v};
    else if(ty==='date') p[f]={date:v||''};
    else if(ty==='multi_select') p[f]={multi_select:Array.isArray(v)?v:[]};
    else if(ty==='image') p[f]={image:{images:Array.isArray(v)?v:[]}};
    else if(ty==='select') p[f]={select:v||''};
    else p[f]={text:v==null?'':v};
  });
  return p;
}

function pf(k,v){ return '<div class="pf"><div class="k">'+k+'</div><div class="v">'+v+'</div></div>'; }
function countdown(start){
  if(!start) return {k:'开工日期',v:'—'};
  var diff=daysBetween(todayStr(),start);
  if(diff>0) return {k:'距开工还有',v:diff+' 天'};
  return {k:'已开工',v:Math.abs(diff)+' 天'};
}

function renderGantt(){
  var host=document.getElementById('gantt');
  var rows=PHASES.map(function(ph){
    var subs=state.tasks.filter(function(t){ return t['阶段']===ph; });
    var s=subs.map(function(t){return t['真实开始日'];}).filter(Boolean);
    var e=subs.map(function(t){return t['真实完成日'];}).filter(Boolean);
    var start=s.length? s.sort()[0]:null;
    var end=e.length? e.sort()[e.length-1]:null;
    return {ph:ph,start:start,end:end};
  }).filter(function(r){ return r.start||r.end; });
  if(!rows.length){ host.innerHTML='<div class="empty">暂无真实起止日数据，填写施工小项后自动生成时间线</div>'; return; }
  var all=[]; rows.forEach(function(r){ if(r.start)all.push(r.start); if(r.end)all.push(r.end); });
  all.push(todayStr());
  var min=all.slice().sort()[0], max=all.slice().sort().reverse()[0];
  var W=Math.max(720, rows.length*0+ (daysBetween(min,max)+4)*34), H=rows.length*38+40, padL=70, padR=20, padT=24;
  var dayW=(W-padL-padR)/Math.max(1,(daysBetween(min,max)+1));
  function x(d){ return padL + daysBetween(min,d)*dayW; }
  var svg='<svg class="gantt" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">';
  // 网格 + 月份
  var cur=null;
  for(var i=0;i<=daysBetween(min,max);i++){
    var dd=new Date(min); dd.setDate(dd.getDate()+i); var ds=dd.getFullYear()+'-'+pad(dd.getMonth()+1)+'-'+pad(dd.getDate());
    var xx=padL+i*dayW;
    svg+='<line x1="'+xx+'" y1="'+padT+'" x2="'+xx+'" y2="'+(H-10)+'" stroke="#ece2d2" stroke-width="1"/>';
    if(dd.getDate()===1 || i===0){ svg+='<text x="'+xx+'" y="14" font-size="11" fill="#7a6e5d">'+dd.getFullYear()+'.'+pad(dd.getMonth()+1)+'</text>'; }
  }
  // today line
  var tx=x(todayStr());
  svg+='<line x1="'+tx+'" y1="'+padT+'" x2="'+tx+'" y2="'+(H-10)+'" stroke="#b5543f" stroke-width="2" stroke-dasharray="4 3"/>';
  svg+='<text x="'+tx+'" y="'+(H-0)+'" font-size="11" fill="#b5543f" text-anchor="middle">今天</text>';
  // bars
  rows.forEach(function(r,idx){
    var y=padT+idx*38+8;
    svg+='<text x="6" y="'+(y+13)+'" font-size="12.5" fill="#4a4036">'+r.ph+'</text>';
    if(r.start){
      var bx=x(r.start), bex=x(r.end||todayStr()), bw=Math.max(dayW, bex-bx);
      var col=['#a9794f','#b08a5e','#8a7d5a','#9c8a63','#c0a878','#7c8a6b','#a98c6b','#8b7a5e'][idx%8];
      svg+='<rect x="'+bx+'" y="'+y+'" width="'+bw+'" height="18" rx="6" fill="'+col+'" opacity="0.85"/>';
      svg+='<text x="'+(bx+6)+'" y="'+(y+13)+'" font-size="10.5" fill="#fff">'+esc(r.ph)+'</text>';
    }
  });
  svg+='</svg>';
  host.innerHTML=svg;
}

  if(ph+ca===0){ el.innerHTML='尚未设置预算目标。点击「设置预算目标」可分别按<b>阶段</b>与<b>分类</b>配置上限；下方汇总会实时按目标统计，未归类的支出单独计入「未分类」。'; return; }
  el.innerHTML='已设置目标：阶段 <b>'+ph+'</b> 项 · 分类 <b>'+ca+'</b> 项。下方按目标实时统计，未归类支出计入「未分类」。';
}
// dim: 'phase' | 'cat'；目标优先来自预算设置(budgetcfg)，若未设置则按预算明细自动汇总
function renderDimSummary(dim, elId){
  var field = dim==='phase'?'所属阶段':'预算分类';
  var cfg=state.budgetcfg.filter(function(c){return c['维度']===dim;});
  var tgt={}, spent={}, uncat=0, auto=false;
  state.budget.forEach(function(b){
    var v=b[field], sp=Number(b['实际花销'])||0, bg=Number(b['预算金额'])||0;
    if(v){ spent[v]=(spent[v]||0)+sp; tgt[v]=(tgt[v]||0)+bg; } else { uncat+=sp; }
  });
  // 若用户已设置预算目标，以目标为准（按目标键值列出）；否则按明细自动汇总
  if(cfg.length){
    tgt={}; cfg.forEach(function(c){ tgt[c['名称']]=Number(c['预算金额'])||0; });
  } else {
    auto=true;
  }
  var keys=Object.keys(tgt);
  var rows=keys.map(function(k){ return bdimRow(k, tgt[k], spent[k]||0, false); });
  if(uncat>0) rows.push(bdimRow('未分类', 0, uncat, true));
  var html = rows.length ? '<div class="bdim">'+rows.join('')+'</div>'
    : '<div class="empty">暂无'+(dim==='phase'?'阶段':'分类')+'预算数据</div>';
  document.getElementById(elId).innerHTML=html;
}
function bdimRow(name, target, spent, isUncat){
  var rate = target ? Math.round(spent/target*100) : (spent?100:0);
  var over = spent>target || (target===0 && spent>0);
  var greenW, redW;
  if(over){ greenW=Math.round(100000/rate)/10; redW=Math.round((rate-100)*1000/rate)/10; }
  else { greenW=rate; redW=0; }
  var greenRadius=over?'999px 0 0 999px':'999px';
  var tgtText = (isUncat||target===0) ? '—' : money(target);
  var pct = (target && target>0) ? (over?'<span style="color:#e03030">'+rate+'%</span>':rate+'%') : '';
  return '<div class="bdim-row">'
    +'<div class="bdim-col-name">'+esc(name)+'</div>'
    +'<div class="bdim-col-bar">'
    +'<div class="bdim-ruler"><span>0</span><span>25</span><span>50</span><span>75</span><span>100</span></div>'
    +'<div class="bdim-track">'
    +'<div class="bdim-green" style="width:'+greenW+'%;border-radius:'+greenRadius+'"></div>'
    +(over?'<div class="bdim-red" style="width:'+redW+'%"></div>':'')
    +'</div></div>'
    +'<div class="bdim-col-num">'
    +(over?'<span style="color:#e03030">'+money(spent)+'</span>':money(spent))
    +' / '+tgtText+(pct?' · '+pct:'')
    +'</div></div>';
}
function showOver(){
  var over=state.budget.filter(function(b){return (Number(b['实际花销'])||0)>(Number(b['预算金额'])||0);});
  var rows=over.map(function(b){ var ex=(Number(b['实际花销'])||0)-(Number(b['预算金额'])||0);
    return '<tr><td>'+esc(b['项目名称'])+'</td><td>'+esc(b['预算分类'])+'</td><td class="num">'+money(b['预算金额'])+'</td><td class="num" style="color:var(--red);font-weight:700">'+money(b['实际花销'])+'</td><td class="num" style="color:var(--red)">+'+money(ex)+'</td></tr>';
  }).join('');
  openModal('超支明细（'+over.length+' 项）','<table class="tbl"><thead><tr><th>项目名称</th><th>分类</th><th class="num">预算</th><th class="num">实际</th><th class="num">超支</th></tr></thead><tbody>'+rows+'</tbody></table><div class="modal-actions" style="margin-top:14px"><button class="btn btn-primary" onclick="closeModal()">知道了</button></div>');
}

function openBudgetSettings(){

function cfgRender(){
  var body=document.getElementById('bSettingsBody'); if(!body) return;
  function rowsHTML(dim){
    var opts = dim==='phase'? PHASES.concat(['通用']) : OPTIONS.budget['预算分类'];
    var list=_cfgDraft.filter(function(c){return c['维度']===dim;});
    if(!list.length) return '<div class="pb-empty" style="padding:2px 0 6px">暂无，点「+ 添加」或从现有汇总生成</div>';
    return list.map(function(c){
      var sel='<select class="cfg-name" data-id="'+c._id+'" style="max-width:170px">'+opts.map(function(o){return '<option'+(o===c['名称']?' selected':'')+'>'+o+'</option>';}).join('')+'</select>';
      return '<div style="display:flex;gap:8px;align-items:center;margin:6px 0">'
        + sel
        + '<input class="cfg-amt" data-id="'+c._id+'" type="number" min="0" step="100" value="'+c['预算金额']+'" style="max-width:150px">'
        + '<span style="color:var(--ink2);font-size:13px">元</span>'
        + '<button class="mini-btn" onclick="cfgDel(\''+c._id+'\')">删</button></div>';
    }).join('');
  }
  body.innerHTML =
    '<div style="font-weight:600;margin:4px 0 2px">阶段预算目标</div>'+rowsHTML('phase')
    + '<div style="display:flex;gap:8px;margin:4px 0 14px"><button class="btn btn-ghost btn-sm" onclick="cfgAdd(\'phase\')">+ 添加阶段</button><button class="btn btn-ghost btn-sm" onclick="cfgGen(\'phase\')">从现有汇总生成</button></div>'
    + '<div style="font-weight:600;margin:4px 0 2px">分类预算目标</div>'+rowsHTML('cat')
    + '<div style="display:flex;gap:8px;margin:4px 0 4px"><button class="btn btn-ghost btn-sm" onclick="cfgAdd(\'cat\')">+ 添加分类</button><button class="btn btn-ghost btn-sm" onclick="cfgGen(\'cat\')">从现有汇总生成</button></div>';
}
function cfgAdd(dim){ _cfgDraft.push({ _id:genId(), '维度':dim, '名称':'', '预算金额':0 }); cfgRender(); }
function cfgDel(id){ _cfgDraft=_cfgDraft.filter(function(c){return c._id!==id;}); cfgRender(); }
function cfgGen(dim){
  var field = dim==='phase'?'所属阶段':'预算分类';
  var opts = dim==='phase'? PHASES.concat(['通用']) : OPTIONS.budget['预算分类'];
  var tgt={}; opts.forEach(function(o){ tgt[o]=0; });
  state.budget.forEach(function(b){ var v=b[field]; if(v && (v in tgt)) tgt[v]+=(Number(b['预算金额'])||0); });
  opts.forEach(function(o){
    var ex=_cfgDraft.filter(function(c){return c['维度']===dim && c['名称']===o;})[0];
    if(ex) ex['预算金额']=tgt[o];
    else _cfgDraft.push({ _id:genId(), '维度':dim, '名称':o, '预算金额':tgt[o] });
  });
  cfgRender();
}
function saveBudgetCfg(draft){
  var existing = state.budgetcfg.map(function(c){return c._id;}).filter(Boolean);
  return Store.removeMany(DB.budgetcfg, existing).then(function(){
    return Promise.all(draft.map(function(c){
      var rec={ '维度':c['维度'], '名称':c['名称'], '预算金额':Number(c['预算金额'])||0 };
      return Store.add(DB.budgetcfg, toProps(DB.budgetcfg, rec)).then(function(id){ if(id) c._id=id; });
    }));
  });
}

function fieldHTML(dbId, obj){
  var key=dbKey(dbId); var html='';
  FIELDS[key].forEach(function(f){
    if(key==='inspiration' && f==='图片') return; // 图片单独处理
    var ty=SCHEMA[key][f]; var v=obj?obj[f]:'';
    html+='<div class="field"><label>'+f+'</label>';
    if(ty==='select'){
      var opts=OPTIONS[key][f]||[];
      html+='<select data-f="'+f+'"><option value="">（不选）</option>'+opts.map(function(o){return '<option'+(v===o?' selected':'')+'>'+o+'</option>';}).join('')+'</select>';
    } else if(ty==='multi_select'){
      var opts2=OPTIONS[key][f]||[]; var sel=Array.isArray(v)?v:[];
      html+='<div class="checks" data-f="'+f+'">'+opts2.map(function(o){return '<span class="chk'+(sel.includes(o)?' on':'')+'" data-v="'+o+'">'+o+'</span>';}).join('')+'</div>';
    } else if(ty==='date'){
      html+='<input type="date" data-f="'+f+'" value="'+(v||'')+'">';
    } else if(ty==='number'){
      html+='<input type="number" data-f="'+f+'" value="'+(v||0)+'">';
    } else if(ty==='checkbox'){
      html+='<input type="checkbox" data-f="'+f+'"'+(v?' checked':'')+'>';
    } else {
      html+='<input type="text" data-f="'+f+'" value="'+esc(v||'')+'">';
    }
    html+='</div>';
  });
  return html;
}
function readForm(dbId){
  var key=dbKey(dbId); var obj={}; var modal=document.getElementById('modal');
  modal.querySelectorAll('[data-f]').forEach(function(el){
    var f=el.getAttribute('data-f'); var ty=SCHEMA[key][f];
    if(ty==='multi_select'){
      var sel=[]; el.querySelectorAll('.chk.on').forEach(function(c){ sel.push(c.getAttribute('data-v')); }); obj[f]=sel;
    } else if(ty==='checkbox'){ obj[f]=el.checked; }
    else if(ty==='number'){ obj[f]=Number(el.value)||0; }
    else if(ty==='date'){ obj[f]=el.value; }
    else { obj[f]=el.value; }
  });
  return obj;
}

var _inspImgs=[];
function handleInspImages(input){
  var files=Array.prototype.slice.call(input.files||[]);
  var existing=(_inspImgs&&_inspImgs.length)?_inspImgs:[];
  var room=30-existing.length; if(room<=0){ toast('最多 30 张'); }
  files.slice(0,Math.max(0,room)).forEach(function(file){
    var rd=new FileReader();
    rd.onload=function(){ compressImage(rd.result,function(dataUrl){ existing.push({imageUrl:dataUrl,title:file.name,width:800,height:600}); _inspImgs=existing; renderInspPrev(); }); };
    rd.readAsDataURL(file);
  });
  input.value='';
}
function renderInspPrev(){
  var prev=document.getElementById('inspPrev'); if(!prev)return;
  prev.innerHTML=(_inspImgs||[]).map(function(im,i){return '<img src="'+im.imageUrl+'" data-i="'+i+'">';}).join('');
  prev.querySelectorAll('img').forEach(function(img){ img.onclick=function(){ _inspImgs.splice(Number(img.getAttribute('data-i')),1); renderInspPrev(); }; });
}
function compressImage(dataUrl, cb){
  var img=new Image(); img.onload=function(){
    var max=800, w=img.width, h=img.height; if(w>h&&w>max){ h=h*max/w; w=max; } else if(h>max){ w=w*max/h; h=max; }
    var c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
    cb(c.toDataURL('image/jpeg',0.85));
  }; img.src=dataUrl;
}

function exportJSON(){
  var data={ tasks:state.tasks, budget:state.budget, inspiration:state.inspiration, profile:state.profile };
  download('装修工作台备份_'+todayStr()+'.json', JSON.stringify(data,null,2), 'application/json');
  toast('已导出 JSON 备份');
}
function csvCell(s){ s=String(s==null?'':s); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }
function exportBudgetCSV(){
  var head=['项目名称','预算分类','所属阶段','预算金额','实际花销','备注'];
  var rows=state.budget.map(function(b){ return [b['项目名称'],b['预算分类'],b['所属阶段'],b['预算金额'],b['实际花销'],b['备注']].map(csvCell).join(','); });
  download('装修预算_'+todayStr()+'.csv', '﻿'+head.join(',')+'\n'+rows.join('\n'), 'text/csv');
  toast('已导出预算 CSV（Excel 可打开）');
}
function backupArea(){
  var body='<div class="field"><button class="btn btn-ghost" style="width:100%" onclick="exportJSON()">导出 JSON 备份</button></div>'
    +'<div class="field"><button class="btn btn-ghost" style="width:100%" onclick="exportBudgetCSV()">导出预算 CSV（Excel 编辑）</button></div>'
    +'<div class="field"><label>导入 JSON 恢复（覆盖当前数据）</label><input type="file" id="impJSON" accept=".json"></div>'
    +'<div class="field"><label>导入预算 CSV（按项目名称匹配更新/新增）</label><input type="file" id="impCSV" accept=".csv"></div>'
    +'<div class="field"><button class="btn btn-ghost" style="width:100%" onclick="reloadExamples()">重新载入示例（含测试数据）</button></div>'
    +'<div class="field"><button class="btn btn-danger" style="width:100%" onclick="clearExamples()">清空示例数据</button></div>'
    +'<div class="field"><button class="btn btn-danger" style="width:100%" onclick="clearAll()">清空全部数据（二次确认）</button></div>'
    +'<div class="modal-actions"><button class="btn btn-primary" onclick="closeModal()">关闭</button></div>';
  openModal('数据管理',body);
  document.getElementById('impJSON').onchange=function(e){ importJSON(e.target.files[0]); };
  document.getElementById('impCSV').onchange=function(e){ importBudgetCSV(e.target.files[0]); };
}
function importJSON(file){
  if(!file) return; var rd=new FileReader();
  rd.onload=function(){
    try{
      var data=JSON.parse(rd.result);
      if(!confirm('导入将覆盖当前全部数据，确定继续？')) return;
      var steps=[];
      ['tasks','budget','inspiration'].forEach(function(key){
        if(!data[key]) return;
        steps.push(Store.query(DB[key]).then(function(rows){ return Store.removeMany(DB[key], rows.map(function(r){return r._id;})); })
          .then(function(){ return Promise.all(data[key].map(function(o){ var id=o._id; var cp=Object.assign({},o); delete cp._id; return Store.add(DB[key],toProps(DB[key],cp)).then(function(nid){ o._id=nid; }); })); }));
      });
      if(data.profile){
        steps.push(Store.query(DB.profile).then(function(rows){ return Store.removeMany(DB.profile, rows.map(function(r){return r._id;})); })
          .then(function(){ var cp=Object.assign({},data.profile); delete cp._id; return Store.add(DB.profile,toProps(DB.profile,cp)).then(function(nid){ data.profile._id=nid; }); }));
      }
      Promise.all(steps).then(function(){ return loadAll(); }).then(function(){ rerender(); closeModal(); toast('导入完成'); });
    }catch(err){ alert('JSON 解析失败'); }
  };
  rd.readAsText(file);
}
function importBudgetCSV(file){
  if(!file) return; var rd=new FileReader();
  rd.onload=function(){
    var lines=rd.result.replace(/﻿/,'').split(/\r?\n/).filter(Boolean);
    if(lines.length<2){ toast('CSV 无数据'); return; }
    var head=lines[0].split(',');
    var upd=[];
    for(var i=1;i<lines.length;i++){
      var cells=lines[i].split(',');
      var o={}; head.forEach(function(h,k){ o[h]=cells[k]; });
      var existing=state.budget.filter(function(b){return b['项目名称']===o['项目名称'];})[0];
      var rec={ '项目名称':o['项目名称'],'预算分类':o['预算分类'],'所属阶段':o['所属阶段'],'预算金额':Number(o['预算金额'])||0,'实际花销':Number(o['实际花销'])||0,'备注':o['备注']||'' };
      if(existing){ upd.push(Store.update(DB.budget,existing._id,toProps(DB.budget,rec)).then(function(){ Object.assign(existing,rec); })); }
      else { upd.push(Store.add(DB.budget,toProps(DB.budget,rec)).then(function(nid){ state.budget.push(normRow(DB.budget,Object.assign({_id:nid},rec))); })); }
    }
    Promise.all(upd).then(function(){ renderBudget(); closeModal(); toast('已导入 '+upd.length+' 条预算'); });
  };
  rd.readAsText(file);
}
function clearExamples(){
  if(Store.mode==='api'){
    if(!confirm('将清空云端全部数据（示例与你的数据都会删除），确定？')) return;
    apiFetch('/api/clear',{method:'DELETE'}).then(function(){ return loadAll(); }).then(function(){ rerender(); toast('已清空云端数据'); })
      .catch(function(e){ toast('操作失败：'+(e&&e.message||e)); });
    return;
  }
  if(!confirm('仅清空初始示例数据（你后续添加的保留），确定？')) return;
  var steps=[];
  ['tasks','budget','inspiration','profile'].forEach(function(key){
    var ids=exampleIds[key]; if(ids&&ids.length) steps.push(Store.removeMany(DB[key],ids));
  });
  Promise.all(steps).then(function(){ localStorage.removeItem('wb_reno_examples'); return loadAll(); }).then(function(){ rerender(); toast('已清空示例数据'); });
}
function clearAll(){
  if(!confirm('⚠ 将清空全部数据且不可恢复，确定？')) return;
  if(!confirm('再次确认：所有待办、预算、灵感、档案都会删除，确定清空？')) return;
  if(Store.mode==='api'){
    apiFetch('/api/clear',{method:'DELETE'}).then(function(){ state={tasks:[],budget:[],inspiration:[],profile:null}; rerender(); toast('已清空全部数据'); })
      .catch(function(e){ toast('操作失败：'+(e&&e.message||e)); });
    return;
  }
  var steps=['tasks','budget','inspiration','profile'].map(function(key){
    return Store.query(DB[key]).then(function(rows){ return Store.removeMany(DB[key], rows.map(function(r){return r._id;})); });
  });
  Promise.all(steps).then(function(){ state={tasks:[],budget:[],inspiration:[],profile:null}; rerender(); toast('已清空全部数据'); });
}
function reloadExamples(){
  if(!confirm('将清空云端当前全部数据并重新载入内置示例（含测试数据），确定？')) return;
  if(Store.mode==='api'){
    apiFetch('/api/reset',{method:'POST'}).then(function(){ return loadAll(); }).then(function(){ rerender(); closeModal(); toast('已重新载入示例'); })
      .catch(function(e){ toast('载入失败：'+(e&&e.message||e)); });
    return;
  }
  var steps=['tasks','budget','inspiration','profile'].map(function(key){
    return Store.query(DB[key]).then(function(rows){ return Store.removeMany(DB[key], rows.map(function(r){return r._id;})); });
  });
  Promise.all(steps).then(function(){
    exampleIds={tasks:[],budget:[],inspiration:[],profile:[]};
    return seedExamples();
  }).then(function(){
    localStorage.setItem('wb_reno_examples', JSON.stringify(exampleIds));
    localStorage.setItem('wb_reno_initialized','1');
    return loadAll();
  }).then(function(){ rerender(); closeModal(); toast('已重新载入示例'); })
    .catch(function(err){ console.error('reloadExamples failed:', err); toast('载入失败：'+(err&&err.message?err.message:err)); });
}

/* ===== 导航 ===== */
function showPage(name){
  document.querySelectorAll('.page').forEach(function(p){ p.classList.remove('active'); });
  document.getElementById('page-'+name).classList.add('active');
  document.querySelectorAll('.nav-item,.bn').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-page')===name); });
  if(name==='overview') renderOverview();
}
document.querySelectorAll('[data-page]').forEach(function(b){ b.onclick=function(){ showPage(b.getAttribute('data-page')); }; });
document.getElementById('todoTypeSeg').addEventListener('click',function(e){ if(e.target.dataset.type){ this.querySelectorAll('button').forEach(function(x){x.classList.remove('on');}); e.target.classList.add('on'); todoFilter.type=e.target.dataset.type; renderTodos(); } });
document.getElementById('todoPriFilter').addEventListener('change',function(){ todoFilter.pri=this.value; renderTodos(); });
document.getElementById('todoCatFilter').addEventListener('change',function(){ todoFilter.cat=this.value; renderTodos(); });
document.getElementById('inspFilter').addEventListener('change',renderInsp);
document.getElementById('inspFavOnly').addEventListener('change',renderInsp);

/* ===== 启动 ===== */
function setSync(mode){
  var badge=document.getElementById('syncBadge'); var txt=document.getElementById('syncText');
  if(mode==='api'){ badge.className='sync online'; txt.textContent='已连接 · 云端CSV'; }
  else if(mode==='online'){ badge.className='sync online'; txt.textContent='已同步 · 在线'; }
  else { badge.className='sync offline'; txt.textContent='离线模式 · 本地存储'; }
}
function boot(){
  Store.init();
  setSync(Store.mode);
  loadAll().then(function(){
    // 首次为空 → 注入示例
    var total=state.tasks.length+state.budget.length+state.inspiration.length+ (state.profile?1:0);
    if(Store.mode!=='api' && total===0 && !localStorage.getItem('wb_reno_initialized')){
      return seedExamples().then(function(){ localStorage.setItem('wb_reno_examples', JSON.stringify(exampleIds)); localStorage.setItem('wb_reno_initialized','1'); return loadAll(); });
    }
    localStorage.setItem('wb_reno_initialized','1');
    try{ var ex=JSON.parse(localStorage.getItem('wb_reno_examples')||'null'); if(ex) exampleIds=ex; }catch(e){}
    return;
  }).then(function(){
    rerender();
  }).catch(function(err){ console.error(err); setSync('offline'); rerender(); });
}
boot();
</script>
